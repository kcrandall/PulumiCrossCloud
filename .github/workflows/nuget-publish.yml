name: NuGet Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (SemVer)."
        required: false
        type: string
      prerelease:
        description: "Prerelease channel suffix."
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - stable

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      INPUT_VERSION: ${{ github.event.inputs.version }}
      INPUT_PRERELEASE: ${{ github.event.inputs.prerelease || 'alpha' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve lockstep version
        id: version
        run: |
          VERSION="$(bash ./scripts/resolve-version.sh --version "${INPUT_VERSION:-}" --prerelease "${INPUT_PRERELEASE:-alpha}")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

  plugins:
    name: Provider plugins ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        # Native AOT compiles for the host OS, so each platform builds on its own runner.
        # macOS is Apple Silicon only; Intel Macs are not supported.
        include:
          - { rid: linux-x64, runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: win-x64, runner: windows-latest }
          - { rid: win-arm64, runner: windows-11-arm }
          - { rid: osx-arm64, runner: macos-latest }
    env:
      DOTNET_NOLOGO: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Package Native AOT plugins
        run: bash ./scripts/package-plugins.sh --version "${{ needs.version.outputs.version }}" --rid "${{ matrix.rid }}" --output artifacts/plugins

      - name: Upload plugin archives
        uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ matrix.rid }}
          path: artifacts/plugins/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, plugins]
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub release that hosts the provider plugins.
      contents: write
    env:
      DOTNET_NOLOGO: true
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Pack all PulumiCrossCloud packages
        run: |
          bash ./scripts/pack.sh --version "${PACKAGE_VERSION}" --prerelease stable

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

      - name: Download plugin archives
        uses: actions/download-artifact@v8
        with:
          pattern: plugins-*
          path: artifacts/plugins
          merge-multiple: true

      # The packages resolve each pulumi-resource-crosscloud-* plugin from the release tagged with
      # their own version (github://api.github.com/kcrandall/PulumiCrossCloud), so the release is
      # created and checked before the packages that point at it are published.
      - name: Publish provider plugins to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${PACKAGE_VERSION}"
          PRERELEASE_FLAG=()
          [[ "${PACKAGE_VERSION}" == *-* ]] && PRERELEASE_FLAG=(--prerelease)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" artifacts/plugins/*.tar.gz --clobber
          else
            gh release create "${TAG}" artifacts/plugins/*.tar.gz \
              --target "${GITHUB_SHA}" \
              --title "PulumiCrossCloud ${PACKAGE_VERSION}" \
              --notes "NuGet packages and pulumi-resource-crosscloud-* provider plugins for ${PACKAGE_VERSION}." \
              "${PRERELEASE_FLAG[@]}"
          fi

  verify-plugins:
    name: Plugin download on ${{ matrix.os }}
    needs: [version, release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.272.0
          echo "${HOME}/.pulumi/bin" >> "${GITHUB_PATH}"

      - name: Install each plugin the way Pulumi downloads it
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # Authenticated requests avoid GitHub's anonymous API rate limit on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for plugin in $(bash ./scripts/package-plugins.sh --list); do
            pulumi plugin install resource "crosscloud-${plugin}" "${VERSION}" \
              --server github://api.github.com/kcrandall/PulumiCrossCloud
          done
          pulumi plugin ls | grep crosscloud-

  publish:
    needs: [version, verify-plugins]
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "NUGET_API_KEY is not configured; skipping publish."
            exit 0
          fi

          bash ./scripts/publish-nuget.sh
